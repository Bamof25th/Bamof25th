# Place this file at:  .github/workflows/snake.yml
# It regenerates the animated contribution snake every 12 hours
# and pushes the SVGs to the "output" branch, which the README reads.

name: Generate Snake Animation

on:
  schedule:
    # runs at 00:00 and 12:00 UTC every day
    - cron: "0 */12 * * *"
  workflow_dispatch:   # lets you run it manually from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
